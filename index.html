<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ORTHO FEED — Hunter System</title>
  <meta name="theme-color" content="#0A0E17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg: #0A0E17;
      --card-bg: #111827;
      --card-inner: #1F2937;
      --border: #374151;
      --primary: #38BDF8;
      --primary-glow: rgba(56, 189, 248, 0.35);
      --accent: #10B981;
      --accent-glow: rgba(16, 185, 129, 0.35);
      --danger: #EF4444;
      --danger-glow: rgba(239, 68, 68, 0.35);
      --yellow: #FBBF24;
      --purple: #A855F7;
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
      --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      user-select: none;
    }

    /* Hunter System HUD (Top Bar) */
    header.hud-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(10, 14, 23, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .hud-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    .hunter-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .rank-tag {
      font-size: 0.72rem;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 4px;
      background: linear-gradient(135deg, #1E40AF, #3B82F6);
      color: #FFF;
      letter-spacing: 0.5px;
      box-shadow: 0 0 10px var(--primary-glow);
    }
    .rank-tag.E-Rank { background: #4B5563; }
    .rank-tag.D-Rank { background: #2563EB; }
    .rank-tag.C-Rank { background: #059669; }
    .rank-tag.B-Rank { background: #D97706; }
    .rank-tag.A-Rank { background: #DC2626; }
    .rank-tag.S-Rank { background: linear-gradient(135deg, #7C3AED, #EC4899); box-shadow: 0 0 14px rgba(236,72,153,0.6); }

    .hunter-name {
      font-weight: 800;
      font-size: 0.95rem;
      color: #FFF;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .hunter-level {
      color: var(--primary);
      font-weight: 900;
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .streak-pill {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--yellow);
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(251, 191, 36, 0.12);
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .status-btn {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .status-btn:active { transform: scale(0.96); }

    /* XP Progress Gauge */
    .xp-container {
      width: 100%;
      height: 6px;
      background: #1F2937;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .xp-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38BDF8, #818CF8);
      border-radius: 4px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 8px var(--primary-glow);
    }

    /* TikTok Style Vertical Snap Container */
    main.feed-wrapper {
      width: 100%;
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      padding-top: 70px;
      -webkit-overflow-scrolling: touch;
    }
    main.feed-wrapper::-webkit-scrollbar { display: none; }

    /* Individual Quiz Card */
    section.feed-card {
      width: 100%;
      height: calc(100vh - 70px);
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      position: relative;
    }

    .card-shell {
      width: 100%;
      max-width: 520px;
      max-height: calc(100vh - 100px);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 18px;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      position: relative;
    }
    .card-shell::-webkit-scrollbar { display: none; }

    /* Meta Row */
    .card-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 8px;
    }
    .meta-badge {
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .meta-due {
      color: var(--yellow);
      background: rgba(251, 191, 36, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Case Bite */
    .case-bite {
      background: var(--card-inner);
      border-left: 3px solid var(--primary);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.92rem;
      font-weight: 600;
      color: #FFF;
      line-height: 1.4;
    }

    /* Question Prompt */
    .prompt-box {
      font-size: 0.98rem;
      font-weight: 700;
      color: #F9FAFB;
      line-height: 1.45;
    }

    /* Choices List */
    .choices-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .choice-btn {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 10px;
      text-align: left;
      font-size: 0.88rem;
      line-height: 1.35;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: all 0.15s ease;
      position: relative;
    }
    .choice-btn:active { transform: scale(0.98); }
    .choice-letter {
      font-weight: 800;
      color: var(--primary);
      min-width: 18px;
    }

    .choice-btn.selected-correct {
      background: rgba(16, 185, 129, 0.2) !important;
      border-color: var(--accent) !important;
      color: #6EE7B7 !important;
      font-weight: 700;
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .choice-btn.selected-wrong {
      background: rgba(239, 68, 68, 0.2) !important;
      border-color: var(--danger) !important;
      color: #FCA5A5 !important;
      opacity: 0.75;
    }

    /* Hunter Intel / Reveal Container */
    .intel-box {
      display: none;
      background: #0D1424;
      border: 1px solid #1E3A8A;
      border-radius: 10px;
      padding: 14px;
      gap: 8px;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .intel-header {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .intel-desc {
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1.45;
    }
    .trap-card {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: #FCA5A5;
      line-height: 1.35;
    }
    .trap-card strong { color: #EF4444; }
    .hook-card {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--yellow);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* SRS Grading Bar */
    .srs-bar {
      display: none;
      gap: 8px;
      margin-top: 6px;
      animation: fadeIn 0.3s ease;
    }
    .srs-btn {
      flex: 1;
      padding: 10px 6px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.15s;
    }
    .srs-btn:active { transform: scale(0.96); }
    .srs-btn.again {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #FCA5A5;
    }
    .srs-btn.good {
      background: rgba(251, 191, 36, 0.15);
      border-color: rgba(251, 191, 36, 0.4);
      color: #FDE68A;
    }
    .srs-btn.easy {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #6EE7B7;
    }
    .srs-interval {
      font-size: 0.65rem;
      font-weight: 600;
      opacity: 0.8;
    }

    /* Hunter Status Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-card {
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      animation: modalPop 0.25s ease;
    }
    @keyframes modalPop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #FFF;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
    }

    .hunter-profile-box {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cloud-status {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.15);
      color: #10B981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .cloud-status.offline {
      background: rgba(251, 191, 36, 0.15);
      color: var(--yellow);
      border-color: rgba(251, 191, 36, 0.3);
    }

    /* Subspecialty Radar Section */
    .radar-section h4 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .subspec-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .subspec-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .subspec-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .subspec-bar-track {
      height: 6px;
      width: 100%;
      background: #1F2937;
      border-radius: 3px;
      overflow: hidden;
    }
    .subspec-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .action-btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    .action-btn.primary {
      background: linear-gradient(135deg, #0284C7, #38BDF8);
      color: #FFF;
      box-shadow: 0 0 15px var(--primary-glow);
    }
    .action-btn.secondary {
      background: var(--card-inner);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* Floating Scroll Arrow */
    .scroll-hint {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--primary);
      font-size: 1.2rem;
      z-index: 90;
      pointer-events: none;
      animation: bounce 1.8s infinite;
    }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

    /* Level Up Alert */
    .level-up-toast {
      display: none;
      position: fixed;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #1E1B4B, #4338CA);
      border: 2px solid #818CF8;
      border-radius: 12px;
      padding: 14px 24px;
      z-index: 300;
      box-shadow: 0 0 30px rgba(129, 140, 248, 0.7);
      text-align: center;
      animation: alertPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes alertPop { from { transform: translate(-50%, -20px) scale(0.9); opacity: 0; } to { transform: translate(-50%, 0) scale(1); opacity: 1; } }
    .level-up-toast h3 { font-size: 1.1rem; color: #FDE047; font-weight: 900; margin-bottom: 2px; }
    .level-up-toast p { font-size: 0.85rem; color: #FFF; font-weight: 600; }
  </style>
</head>
<body>

  <!-- Top HUD -->
  <header class="hud-bar">
    <div class="hud-top-row">
      <div class="hunter-badge" onclick="openStatusModal()">
        <span class="rank-tag E-Rank" id="hudRank">E-RANK</span>
        <div class="hunter-name">
          <span id="hudName">Hunter</span>
          <span class="hunter-level" id="hudLevel">Lv.1</span>
        </div>
      </div>
      <div class="hud-actions">
        <div class="streak-pill" id="hudStreak">🔥 0</div>
        <button class="status-btn" onclick="openStatusModal()">📊 Status</button>
      </div>
    </div>
    <div class="xp-container">
      <div class="xp-bar" id="hudXpBar"></div>
    </div>
  </header>

  <!-- Level Up System Notification -->
  <div class="level-up-toast" id="levelUpToast">
    <h3>⚡ SYSTEM NOTIFICATION</h3>
    <p id="levelUpMsg">LEVEL UP! You reached Level 2!</p>
  </div>

  <!-- Vertical Scroll Feed -->
  <main class="feed-wrapper" id="feedWrapper">
    <!-- Populated by JS -->
  </main>

  <div class="scroll-hint">↓</div>

  <!-- Hunter Status Modal -->
  <div class="modal-backdrop" id="statusModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">⚔️ HUNTER STATUS WINDOW</div>
        <button class="close-btn" onclick="closeStatusModal()">×</button>
      </div>

      <div class="hunter-profile-box">
        <div>
          <div style="font-weight: 800; font-size: 1.05rem;" id="modalProfileName">Hunter Resident</div>
          <div style="font-size: 0.8rem; color: var(--text-muted);" id="modalProfileRank">E-Rank • Novice Resident</div>
        </div>
        <div class="cloud-status" id="modalCloudStatus">🟢 Connected</div>
      </div>

      <div>
        <label style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Hunter ID / Codename</label>
        <div style="display: flex; gap: 8px; margin-top: 4px;">
          <input type="text" id="hunterIdInput" style="flex: 1; background: var(--card-inner); border: 1px solid var(--border); color: #FFF; padding: 10px 12px; border-radius: 8px; font-weight: 700;" placeholder="Enter Hunter Name">
          <button class="status-btn" onclick="saveHunterId()" style="padding: 0 16px; background: var(--primary); color: #000; font-weight: 800;">Switch</button>
        </div>
      </div>

      <!-- Weak / Strong Analysis -->
      <div class="radar-section">
        <h4>Subspecialty Mastery & Radar</h4>
        <div class="subspec-list" id="subspecList">
          <!-- Rendered via JS -->
        </div>
      </div>

      <div class="modal-actions">
        <button class="action-btn primary" onclick="manualSync()">☁️ Sync Cloud (Force Push/Pull)</button>
        <button class="action-btn secondary" onclick="closeStatusModal()">Resume Feed</button>
      </div>
    </div>
  </div>

  <!-- Load 100 Quizzes Dataset -->
  <script src="quizzes.js"></script>

  <!-- Main Game Engine & Firebase Sync -->
  <script>
    // 1. Firebase Initialization
    const firebaseConfig = {
      apiKey: "AIzaSyALJg_gi-a3j0ldWPNgcLJhHWUIKSmwT00",
      authDomain: "ortho-feed.firebaseapp.com",
      projectId: "ortho-feed",
      storageBucket: "ortho-feed.firebasestorage.app",
      messagingSenderId: "718472452928",
      appId: "1:718472452928:web:bf14f7f9bfbca627e378a5"
    };

    let db = null;
    let isCloudOnline = false;

    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        isCloudOnline = true;
      }
    } catch(err) {
      console.warn("Firebase offline or blocked. Using local storage.", err);
    }

    // 2. Sound Effects Engine (Web Audio API Synthesizer)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(type) {
      if (audioCtx.state === 'suspended') { audioCtx.resume(); }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'correct') {
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.setValueAtTime(880, now + 0.08); // A5
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'wrong') {
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(164.81, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      } else if (type === 'levelup') {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.2, now + i * 0.1);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.25);
          o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.25);
        });
      }
    }

    // 3. User State & Hunter Engine
    let hunterState = {
      hunterId: localStorage.getItem('ortho_hunter_id') || 'Hunter_' + Math.floor(1000 + Math.random() * 9000),
      lastCardId: localStorage.getItem('ortho_last_card_id') || 'orthofeed_q1',
      level: 1,
      currentXp: 0,
      streak: 0,
      totalAnswered: 0,
      totalCorrect: 0,
      subspecs: {}, // { [topic]: { total: 0, correct: 0 } }
      srsCards: {} // { [cardId]: { interval: 1, ease: 2.5, reps: 0, due: Date.now(), selectedIdx: -1, isCorrect: false } }
    };

    function getRank(lvl) {
      if (lvl >= 100) return { rank: "S-Rank", title: "National Level Hunter" };
      if (lvl >= 75) return { rank: "S-Rank", title: "Professor of Orthopedics" };
      if (lvl >= 50) return { rank: "A-Rank", title: "Senior Attending" };
      if (lvl >= 30) return { rank: "B-Rank", title: "Fellow" };
      if (lvl >= 15) return { rank: "C-Rank", title: "Chief Resident" };
      if (lvl >= 6) return { rank: "D-Rank", title: "Junior Resident" };
      return { rank: "E-Rank", title: "Orthopedic Intern" };
    }

    function getNextLevelXp(lvl) {
      return lvl * 100;
    }

    function addXp(amount) {
      hunterState.currentXp += amount;
      const nextXp = getNextLevelXp(hunterState.level);
      if (hunterState.currentXp >= nextXp) {
        hunterState.level++;
        hunterState.currentXp -= nextXp;
        triggerLevelUp();
      }
      updateHud();
      syncStateDebounced();
    }

    function triggerLevelUp() {
      playSfx('levelup');
      const r = getRank(hunterState.level);
      const toast = document.getElementById('levelUpToast');
      document.getElementById('levelUpMsg').innerText = `LEVEL UP! Level ${hunterState.level} reached (${r.rank} • ${r.title})!`;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3500);
    }

    function updateHud() {
      const r = getRank(hunterState.level);
      const nextXp = getNextLevelXp(hunterState.level);
      const pct = Math.min(100, Math.floor((hunterState.currentXp / nextXp) * 100));

      const hudRank = document.getElementById('hudRank');
      hudRank.innerText = r.rank.toUpperCase();
      hudRank.className = `rank-tag ${r.rank}`;

      document.getElementById('hudName').innerText = hunterState.hunterId;
      document.getElementById('hudLevel').innerText = `Lv.${hunterState.level}`;
      document.getElementById('hudStreak').innerText = `🔥 ${hunterState.streak}`;
      document.getElementById('hudXpBar').style.width = `${pct}%`;
    }

    // 4. Feed & Card Generation with State Restoration & Intersection Tracking
    let cardObserver = null;

    function buildFeed() {
      const wrapper = document.getElementById('feedWrapper');
      wrapper.innerHTML = '';
      const list = window.ORTHO_QUIZZES || [];

      // Setup IntersectionObserver to track currently viewed card as user scrolls
      if (cardObserver) cardObserver.disconnect();
      cardObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
            const cardId = entry.target.id.replace('card_', '');
            hunterState.lastCardId = cardId;
            localStorage.setItem('ortho_last_card_id', cardId);
            syncStateDebounced();
          }
        });
      }, { root: wrapper, threshold: 0.5 });

      list.forEach((q, idx) => {
        const card = document.createElement('section');
        card.className = 'feed-card';
        card.id = `card_${q.id}`;

        const letters = ['A', 'B', 'C', 'D', 'E'];
        let choicesHtml = '';
        q.choices.forEach((c, cIdx) => {
          choicesHtml += `
            <button class="choice-btn" id="btn_${q.id}_${cIdx}" onclick="onSelectChoice('${q.id}', ${cIdx}, ${q.correctIndex})">
              <span class="choice-letter">${letters[cIdx]}</span>
              <span>${c}</span>
            </button>
          `;
        });

        const srsInfo = hunterState.srsCards[q.id];
        const isAnswered = srsInfo && srsInfo.selectedIdx !== undefined && srsInfo.selectedIdx >= 0;
        const dueText = srsInfo && srsInfo.interval ? `${srsInfo.interval}d interval` : 'New Card';

        card.innerHTML = `
          <div class="card-shell">
            <div class="card-meta-row">
              <span class="meta-badge">${q.badge}</span>
              <span class="meta-due" id="due_${q.id}">${dueText}</span>
            </div>

            <div class="case-bite">
              ⚡ ${q.card.case_bite}
            </div>

            <div class="prompt-box">
              ${q.card.prompt}
            </div>

            <div class="choices-list" id="choices_${q.id}">
              ${choicesHtml}
            </div>

            <div class="intel-box" id="intel_${q.id}" style="${isAnswered ? 'display: flex;' : 'display: none;'}">
              <div class="intel-header">🎯 ${q.reveal.key_takeaway}</div>
              <div class="intel-desc">💡 ${q.reveal.why_correct}</div>
              <div class="trap-card">⚠️ <strong>TRAP:</strong> ${q.reveal.trap_alert}</div>
              <div class="hook-card">🧠 ${q.reveal.hook}</div>
            </div>

            <div class="srs-bar" id="srs_${q.id}" style="${isAnswered ? 'display: flex;' : 'display: none;'}">
              <button class="srs-btn again" onclick="onGradeCard('${q.id}', 'AGAIN')">
                <span>🔴 AGAIN</span>
                <span class="srs-interval">10m (+5 XP)</span>
              </button>
              <button class="srs-btn good" onclick="onGradeCard('${q.id}', 'GOOD')">
                <span>🟡 GOOD</span>
                <span class="srs-interval">1d (+15 XP)</span>
              </button>
              <button class="srs-btn easy" onclick="onGradeCard('${q.id}', 'EASY')">
                <span>🟢 EASY</span>
                <span class="srs-interval">3d (+25 XP)</span>
              </button>
            </div>
          </div>
        `;
        wrapper.appendChild(card);
        cardObserver.observe(card);

        // If card was answered, highlight the buttons
        if (isAnswered) {
          setTimeout(() => {
            const btn = document.getElementById(`btn_${q.id}_${srsInfo.selectedIdx}`);
            const correctBtn = document.getElementById(`btn_${q.id}_${q.correctIndex}`);
            if (srsInfo.isCorrect) {
              if (btn) btn.classList.add('selected-correct');
            } else {
              if (btn) btn.classList.add('selected-wrong');
              if (correctBtn) correctBtn.classList.add('selected-correct');
            }
          }, 0);
        }
      });
    }

    // 5. Choice Selection & Reveal
    function onSelectChoice(cardId, selectedIdx, correctIdx) {
      const q = window.ORTHO_QUIZZES.find(item => item.id === cardId);
      if (!q) return;

      const choicesList = document.getElementById(`choices_${cardId}`);
      const buttons = choicesList.querySelectorAll('.choice-btn');
      buttons.forEach(b => b.onclick = null);

      const isCorrect = (selectedIdx === correctIdx);
      hunterState.totalAnswered++;

      // Track card answered status
      if (!hunterState.srsCards[cardId]) {
        hunterState.srsCards[cardId] = { interval: 1, ease: 2.5, reps: 0 };
      }
      hunterState.srsCards[cardId].selectedIdx = selectedIdx;
      hunterState.srsCards[cardId].isCorrect = isCorrect;
      hunterState.lastCardId = cardId;
      localStorage.setItem('ortho_last_card_id', cardId);

      // Subspecialty tracking
      const topic = q.topic;
      if (!hunterState.subspecs[topic]) hunterState.subspecs[topic] = { total: 0, correct: 0 };
      hunterState.subspecs[topic].total++;

      if (isCorrect) {
        playSfx('correct');
        hunterState.streak++;
        hunterState.totalCorrect++;
        hunterState.subspecs[topic].correct++;
        buttons[selectedIdx].classList.add('selected-correct');
      } else {
        playSfx('wrong');
        hunterState.streak = 0;
        buttons[selectedIdx].classList.add('selected-wrong');
        buttons[correctIdx].classList.add('selected-correct');
      }

      // Reveal Intel & SRS
      document.getElementById(`intel_${cardId}`).style.display = 'flex';
      document.getElementById(`srs_${cardId}`).style.display = 'flex';

      updateHud();
      syncStateDebounced();
    }

    // 6. Spaced Repetition Grading (SM-2 simplified)
    function onGradeCard(cardId, grade) {
      if (!hunterState.srsCards[cardId]) {
        hunterState.srsCards[cardId] = { interval: 1, ease: 2.5, reps: 0 };
      }
      const c = hunterState.srsCards[cardId];

      if (grade === 'AGAIN') {
        c.interval = 0.01; // 10 min
        c.reps = 0;
        addXp(5);
      } else if (grade === 'GOOD') {
        c.interval = (c.reps === 0) ? 1 : Math.round(c.interval * c.ease);
        c.reps++;
        addXp(15);
      } else if (grade === 'EASY') {
        c.interval = (c.reps === 0) ? 3 : Math.round(c.interval * c.ease * 1.3);
        c.ease = Math.min(3.0, c.ease + 0.15);
        c.reps++;
        addXp(25);
      }

      c.due = Date.now() + c.interval * 24 * 60 * 60 * 1000;
      document.getElementById(`due_${cardId}`).innerText = `${c.interval}d interval`;

      // Auto scroll to next card
      scrollToNext(cardId);
      syncStateDebounced();
    }

    function scrollToNext(currentId) {
      const currentCard = document.getElementById(`card_${currentId}`);
      if (currentCard && currentCard.nextElementSibling) {
        currentCard.nextElementSibling.scrollIntoView({ behavior: 'smooth' });
      }
    }

    // 7. Cloud Sync & Local Persistence
    let syncTimer = null;
    function syncStateDebounced() {
      localStorage.setItem('ortho_hunter_state', JSON.stringify(hunterState));
      clearTimeout(syncTimer);
      syncTimer = setTimeout(syncToCloud, 1200);
    }

    async function syncToCloud() {
      if (!db || !isCloudOnline) return;
      try {
        await db.collection('users').doc(hunterState.hunterId).set({
          hunterId: hunterState.hunterId,
          lastCardId: hunterState.lastCardId,
          level: hunterState.level,
          currentXp: hunterState.currentXp,
          streak: hunterState.streak,
          totalAnswered: hunterState.totalAnswered,
          totalCorrect: hunterState.totalCorrect,
          subspecs: hunterState.subspecs,
          srsCards: hunterState.srsCards,
          lastSync: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
        document.getElementById('modalCloudStatus').innerText = "🟢 Synced to Cloud";
        document.getElementById('modalCloudStatus').className = "cloud-status";
      } catch(e) {
        console.error("Cloud sync failed:", e);
        document.getElementById('modalCloudStatus').innerText = "🟡 Local Cache";
        document.getElementById('modalCloudStatus').className = "cloud-status offline";
      }
    }

    async function loadFromCloud(hunterId) {
      if (!db || !isCloudOnline) {
        const local = localStorage.getItem('ortho_hunter_state');
        if (local) Object.assign(hunterState, JSON.parse(local));
        updateHud();
        return;
      }
      try {
        const doc = await db.collection('users').doc(hunterId).get();
        if (doc.exists) {
          const data = doc.data();
          Object.assign(hunterState, data);
          document.getElementById('modalCloudStatus').innerText = "🟢 Cloud Synced";
        } else {
          await syncToCloud();
        }
      } catch(e) {
        console.warn("Could not fetch user document:", e);
      }
      updateHud();
    }

    function saveHunterId() {
      const val = document.getElementById('hunterIdInput').value.trim();
      if (!val) return;
      hunterState.hunterId = val;
      localStorage.setItem('ortho_hunter_id', val);
      loadFromCloud(val);
      updateHud();
      closeStatusModal();
    }

    function manualSync() {
      syncToCloud();
      renderRadar();
      alert("Hunter State synchronized with Firebase Firestore!");
    }

    // 8. Radar / Weak & Strong Subspecialty View
    function renderRadar() {
      const list = document.getElementById('subspecList');
      list.innerHTML = '';
      const allSubs = [
        "Foot & Ankle", "Hand & Wrist", "Pediatric Ortho",
        "Spine", "Trauma", "Oncology", "Sports Medicine",
        "Adult Reconstruction", "Basic Science"
      ];

      allSubs.forEach(sub => {
        const data = hunterState.subspecs[sub] || { total: 0, correct: 0 };
        const pct = data.total > 0 ? Math.round((data.correct / data.total) * 100) : 0;
        
        let color = '#374151';
        let statusText = 'Not Started';
        if (data.total > 0) {
          if (pct >= 75) { color = '#10B981'; statusText = `${pct}% • Mastered`; }
          else if (pct >= 50) { color = '#FBBF24'; statusText = `${pct}% • Competent`; }
          else { color = '#EF4444'; statusText = `${pct}% • WEAK AREA`; }
        }

        const item = document.createElement('div');
        item.className = 'subspec-item';
        item.innerHTML = `
          <div class="subspec-labels">
            <span>${sub}</span>
            <span style="color: ${color}">${statusText}</span>
          </div>
          <div class="subspec-bar-track">
            <div class="subspec-bar-fill" style="width: ${pct}%; background: ${color}"></div>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function openStatusModal() {
      const r = getRank(hunterState.level);
      document.getElementById('modalProfileName').innerText = hunterState.hunterId;
      document.getElementById('modalProfileRank').innerText = `${r.rank} • ${r.title}`;
      document.getElementById('hunterIdInput').value = hunterState.hunterId;
      renderRadar();
      document.getElementById('statusModal').style.display = 'flex';
    }

    function closeStatusModal() {
      document.getElementById('statusModal').style.display = 'none';
    }

    // Auto-Resume to Last Viewed Question on Launch
    function resumeLastPosition() {
      const targetId = hunterState.lastCardId || localStorage.getItem('ortho_last_card_id');
      if (targetId) {
        const el = document.getElementById(`card_${targetId}`);
        if (el) {
          // Instantly jump without smooth animation on initial app launch to avoid dizzying scroll
          el.scrollIntoView({ behavior: 'auto', block: 'start' });
        }
      }
    }

    // Init App
    window.addEventListener('DOMContentLoaded', async () => {
      // 1. Load initial local storage data
      const localId = localStorage.getItem('ortho_hunter_id');
      if (localId) hunterState.hunterId = localId;
      const localState = localStorage.getItem('ortho_hunter_state');
      if (localState) {
        try { Object.assign(hunterState, JSON.parse(localState)); } catch(e){}
      }

      // 2. Build Feed with restored cards
      buildFeed();
      updateHud();

      // 3. Immediately jump to where user left off
      setTimeout(resumeLastPosition, 50);

      // 4. Fetch latest from Cloud
      await loadFromCloud(hunterState.hunterId);
      updateHud();
      setTimeout(resumeLastPosition, 200);
    });
  </script>
</body>
</html>
