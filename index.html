<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM WINDOW V11.1 (CLOUD)</title>
  <style>
    :root { --bg: #090c10; --card: #0d1117; --accent: #9d4edd; --border: #1f2937; --text: #c9d1d9; }
    body { background: var(--bg); color: var(--text); font-family: monospace; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1, h2 { color: var(--accent); text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(157,78,221,0.5); }
    h2 { margin-bottom: 0; }
    .box { background: var(--card); border: 1px solid var(--accent); padding: 15px; margin-bottom: 20px; box-shadow: 0 0 15px rgba(157,78,221,0.1); }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .flex-row { display: flex; gap: 15px; align-items: center; }
    .avatar-box { width: 90px; height: 110px; border: 1px solid var(--accent); background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 11px; color: var(--accent); cursor: pointer; overflow: hidden; position: relative; }
    
    @media (hover: hover) {
      .avatar-box:hover::after { position: absolute; background: rgba(0,0,0,0.7); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; left: 0; top: 0; }
      .avatar-box:not(.has-pic):hover::after { content: "+ UPLOAD"; }
      .avatar-box.has-pic:hover::after { content: "CHANGE"; }
    }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; flex-grow: 1; }
    button { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 3px 8px; cursor: pointer; font-family: monospace; font-size: 11px; margin-left: 2px; }
    button:hover { background: var(--accent); color: #000; }
    .btn-sm { padding: 2px 5px; font-size: 10px; }
    .btn-del { color: #ff4d4d; border-color: #ff4d4d; }
    .btn-del:hover { background: #ff4d4d; color: #000; }
    input[type="text"] { background: #000; border: 1px solid var(--border); color: #fff; padding: 5px; font-family: monospace; width: 50%; }
    ul { list-style: none; padding-left: 15px; border-left: 1px dashed var(--border); margin: 5px 0; }
    li { margin: 8px 0; }
    .completed { text-decoration: line-through; opacity: 0.5; }
    .task-item { cursor: pointer; display: inline-block; margin-right: 5px; }
    .timeline-item { padding: 5px 0 5px 10px; border-left: 2px solid var(--accent); margin-bottom: 5px; }
    .time-badge { color: var(--accent); font-weight: bold; margin-right: 10px; display: inline-block; width: 50px; }
    
    /* Login Screen Styles */
    #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
    #app-container { display: none; }
    .login-box { border: 1px solid var(--accent); padding: 40px; text-align: center; box-shadow: 0 0 20px rgba(157,78,221,0.2); background: var(--card); }
  </style>
</head>
<body>

  <!-- LOGIN TERMINAL -->
  <div id="login-screen">
    <div class="login-box">
      <h1>[ SYSTEM ACCESS ]</h1>
      <p style="margin-bottom: 20px; color: var(--text); opacity: 0.7;">IDENTIFICATION REQUIRED</p>
      <button id="login-btn" style="padding: 10px 20px; font-size: 14px;">[ INITIATE LINK ]</button>
    </div>
  </div>

  <!-- MAIN APP (HIDDEN UNTIL LOGIN) -->
  <div id="app-container">
    <h1>[ SYSTEM WINDOW ]</h1>

    <div class="box">
      <div class="header-row">
        <h2>HUNTER STATUS</h2>
        <div>
          <span id="user-email" style="font-size: 10px; opacity: 0.5; margin-right: 10px;"></span>
          <button id="save-btn" onclick="saveToCloud()">[ SYNC CLOUD ]</button>
          <button id="logout-btn">[ LOGOUT ]</button>
        </div>
      </div>
      <div class="flex-row">
        <input type="file" id="avatar-upload" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">
        <div id="avatar" class="avatar-box" onclick="document.getElementById('avatar-upload').click()"></div>
        <div style="flex-grow: 1;">
          <div>LEVEL: <span id="lvl">1</span> | XP: <span id="xp">0</span>/100</div>
          <div class="stat-grid">
            <div>STR: <span id="str">10</span></div>
            <div>INT: <span id="int">10</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="box">
      <div class="header-row">
        <h2>DAILY QUESTS (RESETS 6AM)</h2>
      </div>
      <div style="margin-bottom: 10px;">
        <input type="text" id="new-daily" placeholder="Enter new daily quest...">
        <button onclick="addDaily()">+ ADD</button>
      </div>
      <div id="daily-tree"></div>
    </div>

    <div class="box">
      <div class="header-row">
        <h2>QUEST LOG (CLEARS AT 6AM)</h2>
      </div>
      <div style="margin-bottom: 10px;">
        <input type="text" id="new-task" placeholder="Enter one-time quest...">
        <button onclick="addTask()">+ ADD</button>
      </div>
      <div id="todo-tree"></div>
    </div>

    <div class="box">
      <div class="header-row">
        <h2>DAILY SCHEDULE</h2>
      </div>
      <div id="timeline"></div>
    </div>
  </div>

  <!-- FIREBASE MODULE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA5POSsrJVJEoC61Yz4oKRydf7iUIhjqCs",
      authDomain: "system-window-db.firebaseapp.com",
      projectId: "system-window-db",
      storageBucket: "system-window-db.firebasestorage.app",
      messagingSenderId: "65215879525",
      appId: "1:65215879525:web:5c22b9e20b52d9a1d2a98c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;

    // Default State Template
    window.state = {
      lvl: 1, xp: 0, str: 10, int: 10,
      lastDate: null,
      avatarImage: null,
      dailies: [
        { id: 1, text: "Physical Training (STR +1)", done: false, type: 'str', time: "", children: [] },
        { id: 2, text: "Mental Focus (INT +1)", done: false, type: 'int', time: "", children: [] }
      ],
      todos: []
    };

    // Authentication Logic
    document.getElementById('login-btn').addEventListener('click', () => {
      signInWithPopup(auth, provider).catch(err => alert("Login Failed: " + err.message));
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      signOut(auth).then(() => {
        document.getElementById('app-container').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
      });
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';
        document.getElementById('user-email').innerText = user.email;
        
        // Load data from Cloud
        const docRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(docRef);
        
        if (docSnap.exists()) {
          window.state = docSnap.data();
        } else {
          // Check if V10 local backup exists, migrate it to cloud
          const localV10 = localStorage.getItem('system_state_v10');
          if (localV10) {
             window.state = JSON.parse(localV10);
          }
          await setDoc(docRef, window.state);
        }
        
        checkDailyReset();
        render();
      } else {
        currentUser = null;
      }
    });

    // Core Cloud Save Function
    window.saveToCloud = async function() {
      if (!currentUser) return;
      const saveBtn = document.getElementById('save-btn');
      saveBtn.innerText = "[ SAVING... ]";
      try {
        await setDoc(doc(db, "users", currentUser.uid), window.state);
        setTimeout(() => saveBtn.innerText = "[ SYNC CLOUD ]", 1000);
        render();
      } catch (e) {
        alert("Error saving to cloud!");
        saveBtn.innerText = "[ ERROR ]";
      }
    };

    // Modified Auto-Save (Wraps the manual save)
    window.save = function() {
      window.saveToCloud();
    };

    // ==========================================
    // ALL V10 LOGIC (Bound to window for access)
    // ==========================================

    window.checkDailyReset = function() {
      const now = new Date();
      const logicalDate = new Date(now);
      if (now.getHours() < 6) logicalDate.setDate(logicalDate.getDate() - 1);
      const todayStr = logicalDate.toDateString();

      if (window.state.lastDate !== todayStr) {
        if (window.state.lastDate !== null) {
          const resetTree = (list) => {
            list.forEach(item => {
              item.done = false;
              if (item.children) resetTree(item.children);
            });
          };
          resetTree(window.state.dailies);

          const filterCompleted = (list) => {
            return list.filter(item => !item.done).map(item => {
              if (item.children) item.children = filterCompleted(item.children);
              return item;
            });
          };
          window.state.todos = filterCompleted(window.state.todos);
        }
        window.state.lastDate = todayStr;
        window.save();
      }
    };

    setInterval(() => { if(currentUser) window.checkDailyReset(); }, 60000);

    window.handleAvatarUpload = function(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = 90; canvas.height = 110;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 90, 110);
          window.state.avatarImage = canvas.toDataURL('image/jpeg', 0.8);
          window.save();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      event.target.value = ''; 
    };

    window.addXp = function(amount) {
      window.state.xp += amount;
      if (window.state.xp >= 100) {
        window.state.lvl += 1;
        window.state.xp -= 100;
        window.state.str += 2;
        window.state.int += 2;
        alert("[ SYSTEM NOTICE ]: LEVEL UP! ALL STATS INCREASED");
      }
    };

    window.addNode = function(targetArray, inputId) {
      const val = document.getElementById(inputId).value.trim();
      if (!val) return;
      targetArray.push({ id: Date.now(), text: val, done: false, time: "", children: [] });
      document.getElementById(inputId).value = '';
      window.save();
    };
    
    window.addDaily = function() { window.addNode(window.state.dailies, 'new-daily'); };
    window.addTask = function() { window.addNode(window.state.todos, 'new-task'); };

    window.addSubtask = function(parentId, targetArrayStr) {
      const targetArray = targetArrayStr === 'dailies' ? window.state.dailies : window.state.todos;
      const text = prompt("Enter subtopic name:");
      if (!text) return;
      const findAndAdd = (list) => {
        for (let node of list) {
          if (node.id === parentId) {
            node.children.push({ id: Date.now(), text: text, done: false, time: "", children: [] });
            return true;
          }
          if (node.children && findAndAdd(node.children)) return true;
        }
      };
      findAndAdd(targetArray);
      window.save();
    };

    window.editNode = function(id, targetArrayStr) {
      const targetArray = targetArrayStr === 'dailies' ? window.state.dailies : window.state.todos;
      const findAndEdit = (list) => {
        for (let node of list) {
          if (node.id === id) {
            const newText = prompt("Edit quest:", node.text);
            if (newText !== null && newText.trim() !== '') node.text = newText.trim();
            return true;
          }
          if (node.children && findAndEdit(node.children)) return true;
        }
      };
      findAndEdit(targetArray);
      window.save();
    };

    window.scheduleNode = function(id, targetArrayStr) {
      const targetArray = targetArrayStr === 'dailies' ? window.state.dailies : window.state.todos;
      const findAndSchedule = (list) => {
        for (let node of list) {
          if (node.id === id) {
            const newTime = prompt("Enter time (e.g. 9-12 or 20:30):", node.time || "");
            if (newTime !== null) node.time = newTime.trim();
            return true;
          }
          if (node.children && findAndSchedule(node.children)) return true;
        }
      };
      findAndSchedule(targetArray);
      window.save();
    };

    window.deleteNode = function(id, targetArrayStr) {
      if(!confirm("Delete this quest?")) return;
      const targetArray = targetArrayStr === 'dailies' ? window.state.dailies : window.state.todos;
      const findAndDelete = (list) => {
        for (let i = 0; i < list.length; i++) {
          if (list[i].id === id) {
            list.splice(i, 1);
            return true;
          }
          if (list[i].children && findAndDelete(list[i].children)) return true;
        }
      };
      findAndDelete(targetArray);
      window.save();
    };

    window.toggleNode = function(id, targetArrayStr, isDaily) {
      const targetArray = targetArrayStr === 'dailies' ? window.state.dailies : window.state.todos;
      const findAndToggle = (list) => {
        for (let node of list) {
          if (node.id === id) {
            node.done = !node.done;
            if (node.done) {
              window.addXp(isDaily ? 30 : 15);
              if (isDaily && node.type === 'str') window.state.str += 1;
              if (isDaily && node.type === 'int') window.state.int += 1;
            } else {
              if (isDaily && node.type === 'str') window.state.str -= 1;
              if (isDaily && node.type === 'int') window.state.int -= 1;
            }
            return true;
          }
          if (node.children && findAndToggle(node.children)) return true;
        }
      };
      findAndToggle(targetArray);
      window.save();
    };

    window.renderTree = function(list, isDaily) {
      if (!list || !list.length) return '';
      const arrayNameStr = isDaily ? "'dailies'" : "'todos'";
      return '<ul>' + list.map(item => `
        <li>
          <span class="task-item ${item.done ? 'completed' : ''}" onclick="toggleNode(${item.id}, ${arrayNameStr}, ${isDaily})">
            [${item.done ? '✓' : ' '}] ${item.text} ${item.time ? `(⌚ ${item.time})` : ''}
          </span>
          <button class="btn-sm" onclick="addSubtask(${item.id}, ${arrayNameStr})">+ sub</button>
          <button class="btn-sm" onclick="editNode(${item.id}, ${arrayNameStr})">edit</button>
          <button class="btn-sm" onclick="scheduleNode(${item.id}, ${arrayNameStr})">time</button>
          <button class="btn-sm btn-del" onclick="deleteNode(${item.id}, ${arrayNameStr})">x</button>
          ${window.renderTree(item.children, isDaily)}
        </li>
      `).join('') + '</ul>';
    };

    window.getScheduled = function(list) {
      let result = [];
      for (let node of list) {
        if (node.time && node.time.trim() !== "") result.push(node);
        if (node.children) result = result.concat(window.getScheduled(node.children));
      }
      return result;
    };

    window.renderTimeline = function() {
      const scheduledDailies = window.getScheduled(window.state.dailies);
      const scheduledTodos = window.getScheduled(window.state.todos);
      const combined = [...scheduledDailies, ...scheduledTodos];
      combined.sort((a, b) => a.time.localeCompare(b.time));

      if (combined.length === 0) {
        document.getElementById('timeline').innerHTML = "<div style='opacity:0.5'>No scheduled quests</div>";
        return;
      }
      document.getElementById('timeline').innerHTML = combined.map(item => `
        <div class="timeline-item ${item.done ? 'completed' : ''}">
          <span class="time-badge">${item.time}</span> ${item.text}
        </div>
      `).join('');
    };

    window.updateAvatar = function() {
      const avatar = document.getElementById('avatar');
      if (window.state.avatarImage) {
        avatar.innerHTML = `<img src="${window.state.avatarImage}" style="width:100%; height:100%; object-fit:cover;">`;
        avatar.classList.add('has-pic');
        return;
      }
      avatar.classList.remove('has-pic');
      if (window.state.lvl < 10) { avatar.innerHTML = "E-RANK<br>Weakest<br>Hunter"; } 
      else if (window.state.lvl < 30) { avatar.innerHTML = "C-RANK<br>Necromancer"; } 
      else if (window.state.lvl < 50) { avatar.innerHTML = "A-RANK<br>Shadow<br>Lord"; } 
      else {
        avatar.innerHTML = "S-RANK<br>Monarch";
        avatar.style.borderColor = "#ff0000";
        avatar.style.color = "#ff0000";
        avatar.style.boxShadow = "0 0 10px red";
      }
    };

    window.render = function() {
      document.getElementById('lvl').innerText = window.state.lvl;
      document.getElementById('xp').innerText = window.state.xp;
      document.getElementById('str').innerText = window.state.str;
      document.getElementById('int').innerText = window.state.int;
      window.updateAvatar();
      
      document.getElementById('daily-tree').innerHTML = window.renderTree(window.state.dailies, true);
      document.getElementById('todo-tree').innerHTML = window.renderTree(window.state.todos, false);
      window.renderTimeline();
    };
  </script>
</body>
</html>
